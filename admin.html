<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>
<body>
    <div class="wrapper">
        <main>
            <div class="fixedHeader">
                <div class="headeroptions">
                    <div class="heading">MCQ Practice Platfrom</div>
                    <div class="navOptions">
                        <ul class="options">
                            <li>Home</li>
                            <li>Practice</li>
                            <li>Admin</li>
                                <li>About</li>
                        </ul>
                    </div>
                </div>
            </div>
            <form action="/" method="post">
                <h1>ADD A NEW QUESTION</h1>
                <label for="subject">Subject:</label>
                <select id="subject">
                    <option selected disabled>Choose Subject</option>
                    <option value="science">Science</option>
                    <option value="mathematics">Mathematics</option>
                    <option value="general-knowledge">General Knowledge</option>
                    <option value="english">English</option>
                </select>
                <label for="question">Question:</label>
                <input type="text" placeholder="Add your question here" id="question">
                <div class="options">
                    <div class="option">
                        <label for="option1">Option A:</label>
                        <input type="text" placeholder="Option A" id="option1">
                        <label for="option2">Option B:</label>
                        <input type="text" placeholder="Option B" id="option2">
                    </div>
                    <div class="option">
                        <label for="option3">Option C:</label>
                        <input type="text" placeholder="Option C" id="option3">
                        <label for="option4">Option C:</label>
                        <input type="text" placeholder="Option C" id="option4">
                    </div>
                </div>
                <label for="correct-option">Correct Answer:</label>
                <select id="correct-option">
                    <option selected disabled>Choose correct option</option>
                    <option value="Option1">Option A</option>
                    <option value="Option2">Option B</option>
                    <option value="Option3">Option C</option>
                    <option value="Option4">Option D</option>
                </select>
                <button type="submit">Add Question</button>

                <div class="subjects">
                    <div class="science">
                        <p>5</p>
                        <p>Science</p>
                    </div>
                    <div class="mathematics">
                        <p>5</p>
                        <p>Mathematics</p>
                    </div>
                    <div class="english">
                        <p>5</p>
                        <p>English</p>
                    </div>
                    <div class="gk">
                        <p>5</p>
                        <p>General Knowledge</p>
                    </div>
                </div>
            </form>
        </main>
    </div>
    
</body>
</html>
